<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003767">
<title>Add your idea · Sheridan Idea Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- ?v= makes browsers fetch fresh files after an update: raise it on every release. -->
<link rel="stylesheet" href="css/base.css?v=9">
<link rel="stylesheet" href="css/add.css?v=9">
</head>
<!-- The phone and tablet submit page: the QR code target (/#add redirects here).
     add.html?kiosk is for tablets at the booth: no remembered name, and the
     screen clears itself 20 s after each post. -->
<body class="add-page">

<header class="add-head">
  <img class="add-logo" src="assets/logo-sheridan.png" alt="Sheridan">
  <span class="tag">Idea Wall</span>
</header>

<main class="add-main">
  <h1 class="add-question">How might Ontario&rsquo;s colleges power growth over the next ten years?</h1>
  <div id="addRoot"></div>
  <p class="add-status" id="addStatus" role="status" hidden></p>
</main>

<!-- Supabase client, pinned to an exact version. Change it only on purpose, after testing. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js?v=9"></script>
<script src="js/areas.js?v=9"></script>
<script src="js/feelings.js?v=9"></script>
<script src="js/db.js?v=9"></script>
<script src="js/outbox.js?v=9"></script>
<script src="js/addform.js?v=9"></script>
<script src="js/add.js?v=9"></script>
</body>
</html>
